<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font rendering for GTK3/Qt/Chrome/Electron apps.

  ~/.Xresources only covers Xt/Xlib-era clients (urxvt, xterm). Everything
  modern reads fontconfig instead, so the grayscale decision has to be stated
  here too or the two disagree.

  Grayscale, not subpixel: the panel runs natively at 3840x2160 (no xrandr
  scaling), near 255 physical DPI. At that density a glyph stem spans several
  pixels, so subpixel AA adds no edge detail it could not already resolve while
  still tinting edges red/blue. Slight hinting for the same reason: the grid
  is dense enough that heavier hinting only distorts shapes.

  NOTE: this is XML, so a comment may never contain a double hyphen. One slipped
  in here and fontconfig rejected the whole file with "not well-formed (invalid
  token)", silently falling back to defaults, which is easy to miss, because
  the error only appears on stderr of whatever happens to load fontconfig next.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <!--
    Generic "monospace" resolved to DejaVu Sans Mono, so any app asking for it
    got a different face from the one used in i3, roxterm and the editors.
  -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>FiraCode Nerd Font Mono</family>
    </prefer>
  </alias>

  <!-- Inter is a UI face: short ascenders, tall x-height, legible at small
       sizes. It replaces DejaVu Sans as the default proportional font. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
</fontconfig>
