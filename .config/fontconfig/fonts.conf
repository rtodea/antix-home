<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font rendering for GTK3/Qt/Chrome/Electron apps.

  ~/.Xresources only covers Xt/Xlib-era clients (urxvt, xterm). Everything
  modern reads fontconfig instead, so the grayscale decision has to be stated
  here too or the two disagree.

  Grayscale, not subpixel: the panel runs at its native 3840x2160 while the
  framebuffer is 1920x1080 (~/.screenlayout/default.sh), so each logical pixel
  is drawn as a 2x2 physical block. Subpixel AA assumes it addresses the real
  R/G/B stripes; doubled, its colour fringes become visible edging rather than
  blending away.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <!--
    Generic "monospace" resolved to DejaVu Sans Mono, so any app asking for it
    got a different face from the one used in i3, roxterm and the editors.
  -->
  <alias>
    <family>monospace</family>
    <prefer><family>FiraCode Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
